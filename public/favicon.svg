<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545" />
      <stop offset="50%" stop-color="#0096c7" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0096c7" />
      <stop offset="100%" stop-color="#00c49f" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="#06152b"/>
  
  <!-- Left Eyewear Lens / Rim -->
  <path d="M10 24 C10 18, 18 18, 24 22 C26 23, 27 25, 27 28 C27 36, 19 40, 14 39 C10 38, 9 32, 10 24 Z" fill="none" stroke="#00b4d8" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Connecting Loop / Flow (Infinity Shape) -->
  <path d="M25 24 C29 20, 33 22, 36 26 C38 29, 41 32, 45 32" fill="none" stroke="url(#lensGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right Eye Contour -->
  <path d="M35 32 C41 23, 51 23, 56 32 C51 41, 41 41, 35 32 Z" fill="none" stroke="url(#eyeGrad)" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Eye Iris & Pupil -->
  <circle cx="45.5" cy="32" r="5" fill="#0096c7"/>
  <circle cx="45.5" cy="32" r="2.5" fill="#06152b"/>
  <circle cx="44.2" cy="30.7" r="1" fill="#ffffff"/>
  
  <!-- Stylized Flow Accent -->
  <path d="M18 42 C26 44, 32 39, 36 34" fill="none" stroke="#00c49f" stroke-width="2" stroke-linecap="round"/>
</svg>